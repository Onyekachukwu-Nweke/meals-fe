name: meals-fe deploy (main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize deploys to this target: while a run is in progress, a newer run
# queues behind it rather than cancelling it, so a half-applied deploy is never
# interrupted. Group is per app+environment to match mountabo's local deploy lock.
concurrency:
  group: mountabo-deploy-meals-fe-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Name this build
        run: |
          run="$GITHUB_RUN_NUMBER"
          [ "$GITHUB_RUN_ATTEMPT" = 1 ] || run="$run.$GITHUB_RUN_ATTEMPT"
          echo "MOUNTABO_ARTIFACT_ID=production-${run}-${GITHUB_SHA::5}" >> "$GITHUB_ENV"

      - name: Build compose images on the runner
        run: |
          cd .
          compose=""
          for cf in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
            if [ -f "$cf" ]; then compose="$cf"; break; fi
          done
          [ -n "$compose" ] || { echo "no compose file found under ." >&2; exit 1; }
          # --no-interpolate: only the structure is needed (which services declare a
          # build:), and the runner has no .env, so unset ${VARS} must not fail here.
          services=$(docker compose -f "$compose" config --no-interpolate --format json \
            | jq -r '.services | to_entries[] | select(.value.build != null) | .key')
          tags=""
          rm -f mountabo.image.override.yml
          for s in $services; do
            svc=$(printf '%s' "$s" | tr '[:upper:]' '[:lower:]')
            tag="mountabo/mtb-8d946244dfa2-$svc:${{ env.MOUNTABO_ARTIFACT_ID }}"
            [ -f mountabo.image.override.yml ] || echo "services:" > mountabo.image.override.yml
            printf '  %s:\n    image: %s\n' "$s" "$tag" >> mountabo.image.override.yml
            tags="$tags $tag"
          done
          # Ship only what compose needs on the server: the compose file(s) and the
          # files they reference inside this repository (env files, mounted
          # configs), at their repo paths. Never the source code.
          ws="$(git rev-parse --show-toplevel)"
          here="$(pwd -P)"
          ov=""
          for f in docker-compose.override.yml docker-compose.override.yaml compose.override.yml compose.override.yaml; do
            if [ -f "$f" ]; then ov="$f"; break; fi
          done
          {
            printf '%s\n' "$compose"
            if [ -n "$ov" ]; then printf '%s\n' "$ov"; fi
            docker compose -f "$compose" ${ov:+-f "$ov"} config --no-interpolate --format json | jq -r '
              [ (.services[]? | (.volumes[]? | select(.type == "bind") | .source),
                                (.env_file[]? | if type == "object" then .path else . end)),
                (.configs[]? | .file), (.secrets[]? | .file) ] | .[] | select(. != null)'
          } | while IFS= read -r p; do
            case "$p" in /*) abs="$p" ;; *) abs="$here/$p" ;; esac
            [ -e "$abs" ] || continue
            abs="$(realpath "$abs")"
            case "$abs" in "$ws"/*) printf '%s\0' "${abs#"$ws"/}" ;; esac
          done | sort -zu > mountabo.compose.list
          tar -czf mountabo.compose.tar.gz -C "$ws" --null -T mountabo.compose.list
          echo "shipping to the server: $(tr '\0' ' ' < mountabo.compose.list)"

          # A compose stack with no build: services has nothing to offload — its
          # images are all pulled, so the server just pulls them on up. Skip the
          # tarball + override entirely (the ship + load steps handle their absence).
          if [ -n "$tags" ]; then
            docker compose -f "$compose" -f mountabo.image.override.yml build
            docker save $tags | zstd -T0 -o image.tar.zst
          else
            echo "no build: services in compose; images will be pulled on the server"
          fi

      - name: Ship image and deploy script to the server
        timeout-minutes: 10
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          # rsync the built image tarball + deploy.sh (+ compose image override)
          # to the box over SSH. rsync --partial resumes a dropped transfer; no -z
          # because the tarball is already zstd-compressed. The key never lands in
          # the repo — it is a run-scoped temp file removed on exit.
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh_opts="ssh -i $key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ssh -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p /tmp/mtb-8d946244dfa2-deploy"
          # The deploy script is always shipped; the tarball (and compose image
          # override) only when the build produced them — a pull-only compose
          # stack has none.
          srcs=".mountabo/deploy-mtb-8d946244dfa2.sh"
          for f in image.tar.zst mountabo.image.override.yml mountabo.compose.tar.gz; do [ -f "$f" ] && srcs="$srcs $f"; done
          rsync -a --partial -e "$ssh_opts" $srcs \
            "$SERVER_USER@$SERVER_HOST:/tmp/mtb-8d946244dfa2-deploy/"

      - name: Deploy on the server
        uses: appleboy/ssh-action@v1.1.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          MOUNTABO_ENV_KEYS: "DATABASE_URL STRIPE_SECRET_KEY JWT_SECRET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY DEPLOY_SSH_PRIVATE_KEY"
          MOUNTABO_ARTIFACT_ID: ${{ env.MOUNTABO_ARTIFACT_ID }}
          MOUNTABO_OPERATION_ID: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          MOUNTABO_COMMIT: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DATABASE_URL,STRIPE_SECRET_KEY,JWT_SECRET,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,DEPLOY_SSH_PRIVATE_KEY,DEPLOY_DIR,MOUNTABO_ENV_KEYS,MOUNTABO_ARTIFACT_ID,MOUNTABO_OPERATION_ID,MOUNTABO_COMMIT
          script: |
            chmod +x /tmp/mtb-8d946244dfa2-deploy/deploy-mtb-8d946244dfa2.sh
            /tmp/mtb-8d946244dfa2-deploy/deploy-mtb-8d946244dfa2.sh main
